[project]
name = "rag-system"
version = "0.1.0"
description = "Course-grounded, multi-tenant RAG engine for teacher-uploaded materials"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.2",
    "python-docx>=1.1",
    "numpy>=1.26",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
rag-benchmark = "rag.eval.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
